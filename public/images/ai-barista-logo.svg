<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b2416" />
      <stop offset="50%" stop-color="#23140c" />
      <stop offset="100%" stop-color="#140b06" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd27d" />
      <stop offset="50%" stop-color="#f4b942" />
      <stop offset="100%" stop-color="#c68642" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffd580" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle with Glowing Golden Border -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3.5" />
  <circle cx="60" cy="60" r="51" fill="none" stroke="rgba(244, 185, 66, 0.25)" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Coffee Cup Body -->
  <path d="M35 52 C35 76 46 84 60 84 C74 84 85 76 85 52 Z" fill="url(#goldGrad)" />
  
  <!-- Cup Rim -->
  <ellipse cx="60" cy="52" rx="25" ry="6" fill="#ffe2c7" stroke="#c68642" stroke-width="1.5" />
  <ellipse cx="60" cy="52" rx="20" ry="4" fill="#3b2416" />

  <!-- Cup Handle -->
  <path d="M82 56 C93 56 97 68 87 75" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Rising Steam Lines with Glowing AI Aura -->
  <path d="M48 42 C46 35 52 30 50 22" fill="none" stroke="url(#sparkleGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <path d="M60 40 C58 32 64 26 61 18" fill="none" stroke="url(#sparkleGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  <path d="M72 42 C70 35 76 30 74 22" fill="none" stroke="url(#sparkleGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

  <!-- AI Sparkle Star top right -->
  <g transform="translate(86, 26) scale(0.95)">
    <path d="M0 -10 Q0 0 10 0 Q0 0 0 10 Q0 0 -10 0 Q0 0 0 -10 Z" fill="url(#sparkleGrad)" filter="url(#glow)" />
  </g>

  <!-- AI Sparkle Mini left -->
  <g transform="translate(26, 36) scale(0.6)">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="url(#goldGrad)" />
  </g>
</svg>
