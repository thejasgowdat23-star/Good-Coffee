<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Colors from original mark -->
    <style>
      .cup-stroke { fill: #361a10; }
      .coffee-liquid { fill: #c8893d; }
      .steam-fill { fill: #efe5d6; }
      .accent-dot { fill: #d89a44; }
    </style>
  </defs>

  <!-- 1. STEAM WISPS -->
  <!-- Left steam wisp -->
  <path class="steam-fill" d="M 228 200 C 224 186 212 178 204 168 C 196 156 198 142 208 135 C 205 146 211 155 218 163 C 226 172 233 182 232 200 Z" />

  <!-- Center S-curved steam wisp -->
  <path class="steam-fill" d="M 246 200 C 243 180 232 165 224 150 C 215 133 218 110 239 96 C 258 83 283 94 290 115 C 295 129 288 145 284 158 C 281 146 284 135 280 125 C 274 110 256 102 243 111 C 230 120 228 136 236 151 C 245 166 254 181 251 200 Z" />

  <!-- Right steam wisp -->
  <path class="steam-fill" d="M 266 200 C 268 184 274 172 281 161 C 288 150 288 138 280 135 C 285 144 284 153 277 163 C 271 172 264 182 262 200 Z" />

  <!-- 2. COFFEE LIQUID SURFACE (OVAL) -->
  <ellipse cx="240" cy="230" rx="66" ry="16" class="coffee-liquid" />

  <!-- 3. CUP RIM TOP -->
  <!-- Rim ellipse stroke -->
  <path class="cup-stroke" fill-rule="evenodd" d="M 240 215 C 310 215 328 226 328 230 C 328 234 310 245 240 245 C 170 245 152 234 152 230 C 152 226 170 215 240 215 Z M 240 227 C 295 227 312 231 312 230 C 312 229 295 233 240 233 C 185 233 168 229 168 230 C 168 231 185 227 240 227 Z" />

  <!-- 4. CUP BODY AND 'G' LETTER -->
  <!-- The main cup outer contour & inner G contour -->
  <g class="cup-stroke">
    <!-- Outer Cup Body Wall with G Cutout -->
    <!-- Outer curve of cup from left rim (160, 230) down to bottom (240, 355) up to right wall (324, 240) -->
    <path fill-rule="evenodd" d="
      M 160 230
      L 176 230
      C 176 250 178 280 200 310
      C 220 336 248 340 270 335
      C 298 328 318 305 322 270
      L 242 270
      L 242 290
      L 298 290
      C 294 308 280 320 262 322
      C 244 324 224 318 210 298
      C 196 278 194 252 195 230
      L 160 230
      Z
    " style="display:none"/>

    <!-- Exact vector path reproducing the reference logo -->
    <!-- Cup Rim & Top Lip -->
    <path d="M 160 226 C 180 216, 300 216, 320 226 C 330 231, 330 240, 320 245 C 300 255, 180 255, 160 245 C 150 240, 150 231, 160 226 Z" fill="none" stroke="#361a10" stroke-width="16" stroke-linejoin="round"/>

    <!-- Coffee surface inside rim -->
    <ellipse cx="240" cy="235.5" rx="72" ry="10" fill="#c8893d" />

    <!-- Stylized "G" Cup Body -->
    <!-- Outer left wall and bottom curve -->
    <path d="M 166 242 C 164 300, 200 354, 260 354 C 315 354, 334 315, 336 280 L 336 242" fill="none" stroke="#361a10" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Inner 'G' spiral: starts from rim left, loops inside, forms horizontal crossbar -->
    <path d="M 206 246 C 186 280, 202 324, 246 324 C 286 324, 308 300, 308 274 L 242 274" fill="none" stroke="#361a10" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cup Handle (Right side) -->
    <path d="M 328 250 L 348 250 C 375 250, 375 308, 345 308 L 330 308" fill="none" stroke="#361a10" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Saucer Bar at base -->
    <path d="M 144 362 C 205 376, 275 376, 336 362" fill="none" stroke="#361a10" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- 5. GOLDEN ACCENT DOT -->
  <circle cx="342" cy="336" r="8" class="accent-dot" />

</svg>